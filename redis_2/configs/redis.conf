# Port on which the replica should run
port 6380

logfile "/var/log/redis/redis-server.log"
dir "/var/lib/redis"

maxmemory 256mb

save 900 1
save 300 10
save 60 10000

# Address of the primary instance
replicaof 127.0.0.1 6379

# AUTH password of the primary instance
masterauth "a_strong_password"

# AUTH password for the replica instance
requirepass "a_strong_password"

#	user sentineluser on >P@ssw0rd allchannels +multi +slaveof +ping +exec +subscribe +config|rewrite +role +publish +info +client|setname +client|kill +script|kill
# Generated by CONFIG REWRITE
latency-tracking-info-percentiles 50 99 99.9
user default on sanitize-payload #733116273917fed0de156e663850b6acaa3b6e0cd69fafb2a44aafcf193517de ~* &* +@all
loadmodule /usr/local/lib/redis/modules//redistimeseries.so
loadmodule /usr/local/lib/redis/modules//redisearch.so
loadmodule /usr/local/lib/redis/modules//redisbloom.so
loadmodule /usr/local/lib/redis/modules//rejson.so

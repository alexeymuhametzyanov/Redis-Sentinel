            - ./sentinel_2/configs:/etc/redis:rw
            - ./sentinel_2/data:/var/lib/sentinel:rw
            - ./sentinel_2/logs:/var/log/redis:rw
        healthcheck:
            test: ["CMD", "redis-cli", "ping"]
            interval: 10s
            timeout: 5s
            retries: 3
        depends_on:
            - redis-1
            - redis-2
            
    sentinel-3:
        image: amd64/redis:8.8.3-trixie
        container_name: sentinel-3
        network_mode: "host"
        hostname: sentinel-3
        command: redis-server /etc/redis/sentinel.conf --sentinel
        environment:
            - TZ=Europe/Moscow
        volumes:
            - ./sentinel_3/configs:/etc/redis:rw
            - ./sentinel_3/data:/var/lib/sentinel:rw
            - ./sentinel_3/logs:/var/log/redis:rw
        healthcheck:
            test: ["CMD", "redis-cli", "ping"]
            interval: 10s
            timeout: 5s
            retries: 3
        depends_on:
            - redis-1
            - redis-2
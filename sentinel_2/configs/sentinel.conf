port 5001

dir "/var/lib/sentinel"
logfile "/var/log/redis/sentinel-server.log"

sentinel monitor resque 127.0.0.1 6380 2
sentinel down-after-milliseconds resque 5000
sentinel failover-timeout resque 60000
sentinel auth-pass resque a_strong_password

sentinel monitor myprimary 127.0.0.1 6379 2
sentinel down-after-milliseconds myprimary 5000
sentinel failover-timeout myprimary 60000
sentinel auth-pass myprimary a_strong_password

# Generated by CONFIG REWRITE
latency-tracking-info-percentiles 50 99 99.9
user default on nopass sanitize-payload ~* &* +@all
sentinel myid 9685fab7c5caab3d8c38908320adadaa5a20c3ef
sentinel config-epoch resque 0
sentinel leader-epoch resque 11
sentinel config-epoch myprimary 0
sentinel leader-epoch myprimary 0
sentinel current-epoch 11

sentinel known-replica myprimary 127.0.0.1 6380

sentinel known-sentinel resque 127.0.0.1 5002 61dbe7c64471dceaf4d9cbabcd67940f4c2d8b2c

sentinel known-sentinel resque 127.0.0.1 5000 70cc0b28f5b966e3143e6d583a93ae87cfcd0eed

sentinel known-sentinel myprimary 127.0.0.1 5002 61dbe7c64471dceaf4d9cbabcd67940f4c2d8b2c

sentinel known-sentinel myprimary 127.0.0.1 5000 70cc0b28f5b966e3143e6d583a93ae87cfcd0eed

